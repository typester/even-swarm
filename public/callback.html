<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Authenticating...</title>
  </head>
  <body>
    <p>Authenticating, please wait...</p>
    <script>
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      const token = params.get("access_token");
      const state = params.get("state");

      const pre = document.createElement("pre");
      pre.style.cssText = "font-size:11px;word-break:break-all;white-space:pre-wrap;margin-top:8px";
      pre.textContent = "hash: " + (window.location.hash || "(empty)") +
        "\ntoken: " + (token || "missing") +
        "\nstate: " + (state || "missing");
      document.body.appendChild(pre);

      if (token && state && (state.startsWith("http://127.0.0.1:") || state.startsWith("http://localhost:"))) {
        window.location.href = state + "#access_token=" + token;
      } else {
        document.querySelector("p").textContent = "Authentication failed.";
      }
    </script>
  </body>
</html>
