<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkin</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #1a1a1a;
        color: #e0e0e0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px;
      }
      h1 { font-size: 1.5rem; margin-bottom: 4px; }
      .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 24px; }

      #login-section { text-align: center; }
      #login-section p { color: #888; font-size: 0.85rem; margin-bottom: 16px; }

      #debug-info {
        margin-top: 24px;
        padding: 12px;
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        font-size: 0.7rem;
        color: #666;
        text-align: left;
        word-break: break-all;
        max-width: 340px;
      }
      #debug-info strong { color: #888; display: block; margin-bottom: 4px; }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary { background: #fa4d56; color: #fff; }
      .btn-primary:active { background: #d93640; }
      .btn-small {
        padding: 6px 12px;
        font-size: 0.8rem;
        background: #333;
        color: #aaa;
        border-radius: 6px;
      }

      #app-section { width: 100%; max-width: 400px; display: none; }
      #status {
        color: #888;
        font-size: 0.85rem;
        text-align: center;
        margin-bottom: 16px;
        min-height: 1.2em;
      }

      .venue-list { display: flex; flex-direction: column; gap: 8px; }
      .venue {
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .venue:active { border-color: #fa4d56; }
      .venue.selected { border-color: #fa4d56; }
      .venue strong { display: block; font-size: 0.95rem; }
      .venue span { color: #888; font-size: 0.8rem; }

      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        max-width: 400px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Checkin</h1>
    <p class="subtitle">Swarm check-in for Even G2</p>

    <div id="login-section">
      <p>Connect your Foursquare account to check in from your glasses.</p>
      <button id="login-btn" class="btn btn-primary">Login with Foursquare</button>
      <div id="debug-info">
        <strong>Debug</strong>
        <div id="debug-version"></div>
        <div id="debug-href"></div>
        <div id="debug-origin"></div>
        <div id="debug-redirect"></div>
      </div>
    </div>

    <div id="app-section">
      <div class="header-row">
        <span id="status">Loading...</span>
        <button id="logout-btn" class="btn btn-small">Logout</button>
      </div>
      <div id="venue-list" class="venue-list"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
